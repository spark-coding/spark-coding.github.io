<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spark Coding hero carousel generator</title>
<!--
  Source for src/assets/img/hero-slide-{1,2,3}.webp (homepage hero carousel).
  Real student work only (no names or usernames):
    1. MakeCode Arcade star catcher: student's own code loaded into arcade.makecode.com,
       hero-src/makecode-star-console.png (simulator console running) + makecode-*.png (the student's scripts)
    2. Scratch Secret Vault remix: hero-src/scratch-vault-stage.png (played in TurboWarp holding A + S)
       + scratch-secret-vault.png (door 4 logic)
    3. Python number guessing game: student's code verbatim + a real run (seeded so the number is 58)
  Render (from website/):  node scripts/render-hero-image.js
-->
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .slide { position: relative; width: 1000px; height: 760px; margin-bottom: 40px; }

  .win { position: absolute; border-radius: 16px; overflow: hidden; background: #1c2230;
         box-shadow: 0 24px 50px rgba(20, 10, 40, .4); }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1c2230; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .win img { display: block; width: 100%; }
  .console { position: absolute; transform: rotate(-4deg); border-radius: 20px; overflow: hidden;
             box-shadow: 0 28px 55px rgba(20, 10, 40, .45); }
  .console img { display: block; width: 100%; clip-path: inset(0 1.5% 1.5% 0 round 20px); margin: 0 -1.5% -1.5% 0; width: 101.5%; }
  .light { background: #f6f7f9; }
  .light .bar { background: #e4e7ec; }

  .keys { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 20px;
          background: rgba(28, 34, 48, .92); border-radius: 14px; color: #fff; font-size: 24px; font-weight: 600;
          box-shadow: 0 14px 30px rgba(20, 10, 40, .35); }
  .key { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 10px;
         background: #fff; color: #1c2230; font-weight: 800; box-shadow: inset 0 -4px 0 #b9c0cc; }

  .py { box-sizing: border-box; padding: 18px 30px 26px; color: #d7deea;
        font: 600 25px/1.45 "SF Mono", Menlo, Consolas, monospace; white-space: pre; }
  .term { box-sizing: border-box; padding: 16px 28px 24px; color: #9fe6a0;
          font: 600 25px/1.45 "SF Mono", Menlo, Consolas, monospace; white-space: pre; background: #0f1420; }
  .term .in { color: #ffd43b; }
  .kw { color: #c792ea; } .fn { color: #82aaff; } .num { color: #f78c6c; } .str { color: #c3e88d; }
</style>
</head>
<body>

<!-- 1. MakeCode Arcade star catcher -->
<div class="slide" id="slide-1">
  <div class="console" style="left: 20px; top: 70px; width: 470px;">
    <img src="hero-src/makecode-star-console.png" alt="">
  </div>
  <div class="win light" style="right: 0; top: 140px; width: 490px; padding-bottom: 18px;">
    <div class="bar"><i></i><i></i><i></i></div>
    <img src="hero-src/makecode-game-update.png" alt="" style="width: 430px; margin: 18px 0 0 18px;">
    <img src="hero-src/makecode-overlap.png" alt="" style="width: 452px; margin: 16px 0 0 18px;">
  </div>
</div>

<!-- 2. Scratch Secret Vault -->
<div class="slide" id="slide-2">
  <div class="win" style="left: 0; top: 0; width: 620px;">
    <div class="bar"><i></i><i></i><i></i></div>
    <img src="hero-src/scratch-vault-stage.png" alt="" style="aspect-ratio: 1888 / 1120; object-fit: cover; object-position: top;">
  </div>
  <div class="keys" style="left: 650px; top: 150px;">Holding <span class="key">A</span> + <span class="key">S</span></div>
  <div class="win light" style="right: 0; bottom: 0; width: 720px;">
    <div class="bar"><i></i><i></i><i></i></div>
    <img src="hero-src/scratch-secret-vault.png" alt="" style="padding: 10px 6px 6px; box-sizing: border-box;">
  </div>
</div>

<!-- 3. Python number guessing game -->
<div class="slide" id="slide-3">
  <div class="win" style="left: 0; top: 0; width: 620px;">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="py"><span class="kw">import</span> random

random_number <span class="kw">=</span> random.<span class="fn">randint</span>(<span class="num">1</span>, <span class="num">100</span>)

<span class="kw">while</span> <span class="kw">True</span>:
    guess <span class="kw">=</span> <span class="fn">int</span>(<span class="fn">input</span>(<span class="str">"guess "</span>))
    <span class="kw">if</span> guess <span class="kw">==</span> random_number:
        <span class="fn">print</span>(<span class="str">"Congratulations!"</span>)
        <span class="kw">break</span>
    <span class="kw">elif</span> guess <span class="kw">&lt;</span> random_number:
        <span class="fn">print</span>(<span class="str">"more"</span>)
    <span class="kw">else</span>:
        <span class="fn">print</span>(<span class="str">"less"</span>)</div>
  </div>
  <div class="win" style="right: 0; bottom: 0; width: 380px; background: #0f1420;">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="term">guess <span class="in">50</span>
more
guess <span class="in">60</span>
less
guess <span class="in">58</span>
Congratulations!</div>
  </div>
</div>

</body>
</html>
